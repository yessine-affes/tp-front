<div class="inline-flex rounded-lg bg-white/20 p-1" role="group" aria-label="Changer de vue">
  @for (option of options; track option.value) {
    <button
      type="button"
      class="cursor-pointer rounded-md px-4 py-1.5 text-sm font-semibold transition duration-200"
      [class]="view() === option.value
        ? 'bg-white text-indigo-700 shadow'
        : 'text-white hover:bg-white/10'"
      [attr.aria-pressed]="view() === option.value"
      (click)="view.set(option.value)">
      {{ option.label }}
    </button>
  }
</div>
