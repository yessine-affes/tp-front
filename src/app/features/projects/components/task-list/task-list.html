<ul class="space-y-2">
  @for (task of tasks(); track task.id) {
    <li>
      <app-task-item
        [task]="task"
        [showAssignee]="showAssignee()"
        [assigneeName]="assigneeName(task.assigneeId)" />
    </li>
  } @empty {
    <li
      class="rounded-lg border border-dashed border-slate-300
             p-3 text-center text-sm italic text-slate-400">
      Aucune tâche
    </li>
  }
</ul>
